name: prompts append-only
on:
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reject edits/deletes under prompts/
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then echo "no base, skip"; exit 0; fi
          BAD=$(git diff --name-status "$BASE" HEAD -- prompts/ | grep -Ev '^A' || true)
          if [ -n "$BAD" ]; then echo "prompts/ is append-only. Not allowed:"; echo "$BAD"; exit 1; fi
          echo "ok"
